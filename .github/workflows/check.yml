name: Flint checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flint-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    defaults:
      run:
        shell: bash

    env:
      APP_NAME: Flint CI
      APP_DEBUG: 'false'
      DATABASE_PORT: '3306'
      JSON_MAX_BODY_BYTES: '4096'
      COMPOSER_NO_INTERACTION: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate shell scripts
        run: |
          bash -n bin/setup.sh
          bash -n bin/doctor.sh
          bash -n bin/application-http-smoke.sh
          bash -n bin/application-http-failure-smoke.sh

      - name: Install and inspect dependencies
        run: composer setup

      - name: Run all checks
        run: composer check:all
